name: tests

# The full suite runs with no secrets and no network: the LLM is an in-process
# fake (tests/fake_llm.py) and the only real dependency is Postgres + pgvector,
# which is the same image Compose uses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lenny
          POSTGRES_PASSWORD: lenny
          POSTGRES_DB: lenny
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lenny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://lenny:lenny@localhost:5432/lenny
      TEST_DATABASE_URL: postgresql+asyncpg://lenny:lenny@localhost:5432/lenny_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The Claude Agent SDK drives this CLI in a subprocess. Without it the one
      # Agent SDK test skips itself; installing it means CI exercises that path
      # for real (against the fake Messages API — no key, no network).
      - name: Install Claude Code CLI (for the Agent SDK runtime test)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
